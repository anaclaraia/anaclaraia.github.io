<aside id="newsletter" class="newsletter-card newsletter-footer" aria-labelledby="footer-newsletter-title">
  <div class="newsletter-intro">
    <p class="newsletter-eyebrow">Newsletter diária · 06:06</p>
    <h3 id="footer-newsletter-title">Clara News na sua caixa de entrada.</h3>
    <p>Ciência, tecnologia e inteligência artificial com contexto, todos os dias.</p>
  </div>

  <form method="post" action="https://app.thestories.cc/subscription/form" class="listmonk-form" accept-charset="UTF-8">
    <input type="hidden" name="nonce">

    <div class="newsletter-fields">
      <div class="newsletter-field">
        <label for="footer-newsletter-email">E-mail</label>
        <input id="footer-newsletter-email" type="email" name="email" required autocomplete="email" placeholder="voce@exemplo.com">
      </div>
      <div class="newsletter-field">
        <label for="footer-newsletter-name">Nome <span>(opcional)</span></label>
        <input id="footer-newsletter-name" type="text" name="name" autocomplete="name" placeholder="Seu nome">
      </div>
      <button type="submit">Inscrever-se <span aria-hidden="true">→</span></button>
    </div>

    <div class="newsletter-meta">
      <label class="newsletter-list" for="footer-clara-news-list">
        <input id="footer-clara-news-list" type="checkbox" name="l" checked required value="ad7d93a4-ce6d-4b6e-a616-ae3473341a45">
        <span><strong>Clara News</strong> · Ciência e tecnologia</span>
      </label>
      <p class="newsletter-privacy">Seu nome e e-mail serão enviados ao nosso serviço de newsletter. Cancele quando quiser.</p>
    </div>
  </form>
</aside>
