<aside class="newsletter-card" aria-labelledby="newsletter-title">

    <label class="newsletter-list" for="ad7d9">
      <input id="ad7d9" type="checkbox" name="l" checked required value="ad7d93a4-ce6d-4b6e-a616-ae3473341a45">
      <span><strong>Clara News</strong><small>Ciência e tecnologia</small></span>
    </label>
    <p class="newsletter-privacy">Seu nome e e-mail serão usados para enviar a newsletter. Você poderá cancelar a inscrição a qualquer momento.</p>
    <input type="submit" value="Inscrever-se">
  </form>
