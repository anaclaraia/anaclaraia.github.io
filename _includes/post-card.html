<article class="post-card{% if include.post.image %} has-image{% endif %}">
  {% if include.post.image %}<a class="post-thumbnail" href="{{ include.post.url | relative_url }}" tabindex="-1" aria-hidden="true"><img src="{{ include.post.image | relative_url }}" alt="" width="240" height="160" loading="lazy"></a>{% endif %}
  <div><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%d/%m/%Y' }}</time><h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h3>{% if include.post.description %}<p>{{ include.post.description | escape }}</p>{% endif %}<a class="text-link small" href="{{ include.post.url | relative_url }}">Ler publicação <span aria-hidden="true">→</span><span class="sr-only">: {{ include.post.title | escape }}</span></a></div>
</article>
