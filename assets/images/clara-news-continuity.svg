<svg width="620" height="620" viewBox="0 0 620 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Clara News em continuidade</title>
  <desc id="desc">Ilustração original de uma pessoa usando um computador, com cartões digitais da newsletter Clara News.</desc>
  <defs>
    <linearGradient id="background" x1="34" y1="26" x2="584" y2="600" gradientUnits="userSpaceOnUse"><stop stop-color="#FFD9C8"/><stop offset=".5" stop-color="#E47B62"/><stop offset="1" stop-color="#672742"/></linearGradient>
    <linearGradient id="screen" x1="205" y1="367" x2="497" y2="589" gradientUnits="userSpaceOnUse"><stop stop-color="#253255"/><stop offset="1" stop-color="#000D25"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="19"/></filter>
    <filter id="shadow" x="90" y="40" width="500" height="580" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000D25" flood-opacity=".28"/></filter>
  </defs>

  <rect x="12" y="12" width="596" height="596" rx="4" fill="url(#background)"/>
  <g opacity=".3" filter="url(#blur)"><circle cx="105" cy="112" r="92" fill="#FFF1A8"/><circle cx="535" cy="144" r="105" fill="#75B9FF"/><circle cx="482" cy="530" r="96" fill="#DB132A"/></g>

  <!-- Pessoa e mesa: composição ilustrada original -->
  <path d="M66 422C115 373 182 361 237 386C268 400 285 429 298 476L84 531L66 422Z" fill="#F5B98F"/>
  <path d="M55 423C81 344 142 308 206 332C239 344 263 371 278 411L191 458C163 426 132 416 89 448L55 423Z" fill="#F3C24E"/>
  <path d="M107 154C132 88 218 57 282 94C340 128 354 207 314 263C284 305 222 316 171 287C119 258 86 211 107 154Z" fill="#3A1B2B"/>
  <ellipse cx="224" cy="222" rx="72" ry="91" fill="#EFB28E"/>
  <path d="M155 208C153 132 195 95 247 103C302 111 327 158 313 222C286 203 264 171 253 141C229 176 197 199 155 208Z" fill="#2A1524"/>
  <path d="M174 259C196 278 230 284 258 270" stroke="#C56A61" stroke-width="5" stroke-linecap="round"/>

  <path d="M0 518C137 473 300 477 620 514V620H0V518Z" fill="#E9DED2"/>
  <path d="M231 414H520L550 584H259L231 414Z" fill="url(#screen)"/>
  <path d="M207 584H570L545 604H235L207 584Z" fill="#101A35"/>
  <circle cx="391" cy="502" r="18" stroke="#5268EF" stroke-width="4"/><path d="M391 490V514M379 502H403" stroke="#5268EF" stroke-width="3" stroke-linecap="round"/>

  <!-- Cartões digitais próprios da Clara News -->
  <g filter="url(#shadow)">
    <rect x="228" y="52" width="360" height="146" rx="4" fill="#000D25"/>
    <circle cx="264" cy="88" r="18" fill="#DB132A"/>
    <path d="M256 94L264 80L272 94M259 89H269" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="295" y="94" fill="#9AA0B4" font-family="Arial, sans-serif" font-size="16">CLARA NEWS · 06:06</text>
    <text x="252" y="132" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">Sua curadoria diária</text>
    <text x="252" y="157" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">está pronta.</text>
    <text x="252" y="182" fill="#DDE0E6" font-family="Arial, sans-serif" font-size="13">Ciência, tecnologia e inteligência artificial.</text>

    <rect x="288" y="220" width="300" height="218" rx="4" fill="white"/>
    <rect x="288" y="220" width="300" height="72" rx="4" fill="#1866EE"/>
    <circle cx="323" cy="256" r="14" fill="white" fill-opacity=".2"/><path d="M316 256H330M323 249V263" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <text x="348" y="262" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">Novidades de hoje</text>
    <text x="312" y="330" fill="#000D25" font-family="Arial, sans-serif" font-size="16" font-weight="700">Contexto antes do ruído.</text>
    <text x="312" y="358" fill="#38425E" font-family="Arial, sans-serif" font-size="14">Uma leitura rápida para começar</text>
    <text x="312" y="379" fill="#38425E" font-family="Arial, sans-serif" font-size="14">o dia bem informado.</text>
    <rect x="312" y="398" width="140" height="26" rx="13" fill="#DB132A"/>
    <text x="326" y="416" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="700">LER NOVIDADES</text>
  </g>
</svg>
