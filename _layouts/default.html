<!doctype html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
  <meta name="twitter:card" content="{% if page.image %}summary_large_image{% else %}summary{% endif %}">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TZBPFV014K"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-TZBPFV014K');</script>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/monogram.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Ana Clara — início">
        <img src="{{ '/assets/images/monogram.svg' | relative_url }}" width="38" height="38" alt="">
        <span>Ana Clara<span class="brand-accent">.ia</span></span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-principal"><span></span><span></span><span class="sr-only">Abrir menu</span></button>
      <nav id="menu-principal" aria-label="Navegação principal">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Início</a>
        <a href="{{ '/#tisha-news' | relative_url }}">Tisha News</a>
        <a href="{{ '/blog.html' | relative_url }}"{% if page.url == '/blog.html' %} aria-current="page"{% endif %}>Blog</a>
        <a href="{{ '/sobre/' | relative_url }}"{% if page.url == '/sobre/' %} aria-current="page"{% endif %}>Sobre</a>
        <a class="nav-cta" href="{{ site.whatsapp_url }}" target="_blank" rel="noopener noreferrer">Acompanhar no WhatsApp <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  <main id="conteudo" tabindex="-1">{{ content }}</main>
  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div><a class="footer-brand" href="{{ '/' | relative_url }}">Ana Clara<span>.ia</span></a><p>Inteligência artificial com clareza, contexto e espaço para o humano.</p></div>
      <nav aria-label="Links do rodapé"><a href="{{ '/blog.html' | relative_url }}">Blog</a><a href="{{ '/sobre/' | relative_url }}">Sobre</a><a href="{{ '/feed.xml' | relative_url }}">Feed RSS</a><a href="{{ site.whatsapp_url }}" target="_blank" rel="noopener noreferrer">WhatsApp ↗</a></nav>
      <p class="copyright">© {{ 'now' | date: '%Y' }} Ana Clara.</p>
    </div>
  </footer>
  <script>
    const toggle=document.querySelector('.menu-toggle'),menu=document.querySelector('#menu-principal');
    toggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')==='true';toggle.setAttribute('aria-expanded',String(!open));menu.classList.toggle('is-open',!open)});
  </script>
</body>
</html>
